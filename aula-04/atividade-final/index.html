<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Loja</title>
</head>
<body>
    <header>
   <h1>Mini Loja</h1> 

   <nav>
    <a href="#produtos">Produtos</a> |
    <a href="#video">Vídeo</a> |
    <a href="#contato">Contatos</a> |
    <a href="#local"> Onde estamos</a>
   </nav>
    </header>
<main>

   <section id="produtos">
    <h2>Produtos</h2>
        <article>
            <h3>Iphone 17 Pro Max </h3>

            <img src="img/iphone.jpg" alt="Iphone laranja com três câmeras traseiras, ao lado da tela preta com linhas abstratas em tons de laranja."
            width="250"
            height="250"
            loading="lazy">
            <p>R$9.999,00</p>

        </article>

        <article>
            <h3>Camisa </h3>
            <img src="img/camisa.jpg" alt="camiseta branca de manga curta e gola redonda, apresentada sobre fundo branco."

            width="250"
            height="250"
            loading="lazy">
            <p>R$ 59,90</p>
        </article>

         <article>
            <h3>AirPods Max </h3>
            <figure>
            <img src="img/fone de ouvido.jpg" alt="Fone de ouvido sem fio, com design elegante."

            width="250"
            height="250"
            loading="lazy">
            <figcaption>AirPods Max - R$ 4.998,90</figcaption>
        </figure>
        </article>

    </section>

    <section>
        <h2>Vídeo do produto</h2>

        <video controls width="400" preload="metadata">
            <source src="video/video.mp4" type="video/mp4">
            Seu navegador não suporta vídeo.
        </video>
    </section>

    <section>
        <h2>Descripção em áudio</h2>

        <audio controls preload="metadata">
            <source src="img/descricao-produto.mp3" type="audio/mpeg">
            Seu navegador não suporta áudio.
        </audio>
    </section>

    <section>
        <h2>Conteúdo externo</h2>

        <iframe
        src="https://www.youtube.com/embed/a4cA0ET9DRY"
        width="400"
        height="225"
        title="Vídeo externo sobre tecnologia"
        loading="lazy"
        allowfullscreen> 
    </iframe>
    </section>

    
</main>

<footer><p>Feito por Laura e Darwin</p></footer>

 <hr>
 <hr>


</body>
</html>
