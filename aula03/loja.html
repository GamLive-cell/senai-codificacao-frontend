<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>
</head>

<body>
    <section id="inicio">
        <h1>Bem-vindo à Minha Loja "StyleHair"</h1>
        <nav>
            <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#cadastro">Cadastro</a></li>
            </ul>
            <hr>
        </nav>
        <hr>
    </section>

    <section id="produtos">
        <h2>Produtos em Destaque</h2>
        <ul>
            <li>Esmalte</li>
            <li>Shampoo</li>
            <li>Nivea</li>
        </ul>
        <hr>
        <table>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Categoria</th>
            </tr>

            <tr>
                <td>Esmalte</td>
                <td>R$ 15,90</td>
                <td>Unhas</td>
            </tr>

            <tr>

                <td>Shampoo</td>
                <td>R$ 19,90</td>
                <td>Cabelo</td>
            </tr>

            <tr>

                <td>Nivea</td>
                <td>R$ 29,90</td>
                <td>Corpo</td>
            </tr>
        </table>
    </section>

    <section id="cadastro">
        <fieldset>
            <legend>Cadastro de Usuário</legend>
             <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" minlength="8" placeholder="Digite sua senha" required>

            <SELECT>
                <label>Tipo de cadastro:</label>

                <input type="radio" id="pf" name="tipo" value="pf">
                <label for="pf">Pessoa Física (PF)</label>

                <input type="radio" id="pj" name="tipo" value="pj">
                <label for="pj">Pessoa Jurídica (PJ)</label>
            </SELECT>

            <button type="submit">Cadastrar</button>
        </form>
        </fieldset>
        <form>

           






</body>

</html>
